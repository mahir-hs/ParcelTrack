# ============================================================
# ParcelTrack — Local Infrastructure + Application Services
#
# PostgreSQL runs natively on Windows — create databases manually:
#   CREATE DATABASE parceltrack_shipment;
#   CREATE DATABASE parceltrack_notification;
#   CREATE DATABASE parceltrack_tracking;
#   CREATE DATABASE parceltrack_webhook;
#   CREATE DATABASE parceltrack_keycloak;
#
# STARTUP PROFILES:
#   Infrastructure only:
#     docker-compose --profile messaging up -d
#   Full stack (+ Keycloak):
#     docker-compose --profile messaging --profile auth up -d
#   Application services:
#     docker-compose --profile messaging --profile app up -d
#   Everything:
#     docker-compose --profile messaging --profile auth --profile app up -d
# ============================================================

networks:
  parceltrack-net:
    driver: bridge

volumes:
  redis-data:

services:

  # ──────────────────────────────────────────
  # Redis — Cache, idempotency, rate limiting
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: parceltrack-redis
    restart: unless-stopped
    profiles: ["messaging"]
    mem_limit: 128m
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 100mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - parceltrack-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # Kafka — Event streaming (KRaft mode)
  # No Zookeeper — self-managed metadata via Raft.
  #
  # Listeners:
  #   INTERNAL   (kafka:29092)    — container-to-container
  #   EXTERNAL   (localhost:9092) — .NET services on host
  #   CONTROLLER (kafka:9093)     — KRaft internal only
  # ──────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: parceltrack-kafka
    restart: unless-stopped
    profiles: ["messaging"]
    mem_limit: 512m
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
    networks:
      - parceltrack-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # One-shot topic initialiser — exits after creating topics.
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: parceltrack-kafka-init
    profiles: ["messaging"]
    mem_limit: 256m
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - parceltrack-net
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Creating Kafka topics...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic shipment.created         --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic shipment.status.changed --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic carrier.status.observed  --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic notification.failed     --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic webhook.failed          --partitions 1 --replication-factor 1
      echo 'Topics created:'
      kafka-topics --bootstrap-server kafka:29092 --list
      "
    restart: on-failure

  # ──────────────────────────────────────────
  # Keycloak — Identity & Auth
  # Admin console: http://localhost:8180
  # ──────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: parceltrack-keycloak
    restart: unless-stopped
    profiles: ["auth"]
    mem_limit: 768m
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://host.docker.internal:5432/parceltrack_keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8080
      JAVA_OPTS_APPEND: "-Xmx512m -Xms256m"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/parceltrack-realm.json:/opt/keycloak/data/import/parceltrack-realm.json:ro
    networks:
      - parceltrack-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ══════════════════════════════════════════
  # Application services — profile: app
  # Requires: --profile messaging (Redis + Kafka)
  # ══════════════════════════════════════════

  gateway:
    image: parceltrack-gateway:latest
    build:
      context: .
      dockerfile: src/Gateway/ParcelTrack.Gateway/Dockerfile
    container_name: parceltrack-gateway
    restart: unless-stopped
    profiles: ["app"]
    mem_limit: 256m
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Override YARP cluster address to reach shipment-api inside Docker
      ReverseProxy__Clusters__shipment-cluster__Destinations__shipment-api__Address: http://shipment-api:8080
    depends_on:
      - shipment-api
    networks:
      - parceltrack-net

  shipment-api:
    image: parceltrack-shipment:latest
    build:
      context: .
      dockerfile: src/Services/ShipmentService/ParcelTrack.ShipmentService.API/Dockerfile
    container_name: parceltrack-shipment-api
    restart: unless-stopped
    profiles: ["app"]
    mem_limit: 512m
    ports:
      - "5068:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ShipmentDb: "Host=host.docker.internal;Port=5432;Database=parceltrack_shipment;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
      Kafka__BootstrapServers: kafka:29092
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - parceltrack-net

  notification-worker:
    image: parceltrack-notification:latest
    build:
      context: .
      dockerfile: src/Services/NotificationService/ParcelTrack.NotificationService.Worker/Dockerfile
    container_name: parceltrack-notification-worker
    restart: unless-stopped
    profiles: ["app"]
    mem_limit: 256m
    environment:
      DOTNET_ENVIRONMENT: Production
      Kafka__BootstrapServers: kafka:29092
      # SMTP — override via .env or environment-specific secrets
      Smtp__Host: ${SMTP_HOST:-localhost}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromAddress: ${SMTP_FROM:-noreply@parceltrack.io}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - parceltrack-net

  tracking-worker:
    image: parceltrack-tracking:latest
    build:
      context: .
      dockerfile: src/Services/TrackingService/ParcelTrack.TrackingService.Worker/Dockerfile
    container_name: parceltrack-tracking-worker
    restart: unless-stopped
    profiles: ["app"]
    mem_limit: 256m
    ports:
      - "5072:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__TrackingDb: "Host=host.docker.internal;Port=5432;Database=parceltrack_tracking;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Kafka__BootstrapServers: kafka:29092
      # Carrier credentials — polling stays off until these are supplied
      Polling__Enabled: "${POLLING_ENABLED:-false}"
      Carriers__Pathao__BaseUrl: "${PATHAO_BASE_URL:-https://api-hermes.pathao.com}"
      Carriers__Pathao__ClientId: "${PATHAO_CLIENT_ID:-}"
      Carriers__Pathao__ClientSecret: "${PATHAO_CLIENT_SECRET:-}"
      Carriers__Pathao__Username: "${PATHAO_USERNAME:-}"
      Carriers__Pathao__Password: "${PATHAO_PASSWORD:-}"
      CarrierWebhooks__PathaoSecret: "${PATHAO_WEBHOOK_SECRET:-}"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - parceltrack-net

  webhook-worker:
    image: parceltrack-webhook:latest
    build:
      context: .
      dockerfile: src/Services/WebhookDispatchService/ParcelTrack.WebhookDispatchService.Worker/Dockerfile
    container_name: parceltrack-webhook-worker
    restart: unless-stopped
    profiles: ["app"]
    mem_limit: 256m
    ports:
      - "5070:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__WebhookDb: "Host=host.docker.internal;Port=5432;Database=parceltrack_webhook;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Kafka__BootstrapServers: kafka:29092
      Keycloak__Authority: http://keycloak:8080/realms/parceltrack
      Keycloak__Audience: parceltrack-api
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - parceltrack-net
