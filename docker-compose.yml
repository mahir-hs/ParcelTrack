# ============================================================
# ParcelTrack — Local Development Stack (self-contained)
#
# Everything below runs in Docker. The .NET services (Gateway,
# Shipment/Tracking/Notification/Webhook) run NATIVELY on Windows
# and reach these containers over localhost.
#
# Databases are created automatically by an init script:
#   parceltrack_shipment, parceltrack_notification,
#   parceltrack_tracking, parceltrack_keycloak
#
# PROFILES — run only what you need:
#   db        postgres + pgadmin                 (always needed by the services)
#   messaging redis, kafka, kafka-init, mailpit
#   auth      keycloak                           (also needs the `db` profile)
#
# Common commands:
#   Full stack ............ docker compose --profile db --profile messaging --profile auth up -d
#   Just the database ..... docker compose --profile db up -d
#   DB + messaging ........ docker compose --profile db --profile messaging up -d
#   Stop .................. docker compose down
#   Wipe all data ......... docker compose down -v
#
# NOTE: stop any native PostgreSQL on Windows first — the container
# binds host port 5432.
# ============================================================

networks:
  parceltrack-net:
    driver: bridge

volumes:
  postgres-data:
  pgadmin-data:
  redis-data:

services:

  # ──────────────────────────────────────────
  # PostgreSQL — primary datastore (containerised)
  # 4 databases are auto-created from docker/postgres/init/.
  # Native .NET services connect via localhost:5432 (Password=admin).
  # ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: parceltrack-postgres
    restart: unless-stopped
    profiles: ["db"]
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - parceltrack-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ──────────────────────────────────────────
  # pgAdmin 4 — Web UI to inspect the databases
  # http://localhost:5050  (email/password from .env)
  # A "ParcelTrack" server (host=postgres) is pre-registered.
  # ──────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: parceltrack-pgadmin
    restart: unless-stopped
    profiles: ["db"]
    mem_limit: 256m
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - parceltrack-net
    depends_on:
      postgres:
        condition: service_healthy

  # ──────────────────────────────────────────
  # Redis — Cache, idempotency, rate limiting
  # Alpine image — tiny (~50MB actual usage)
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: parceltrack-redis
    restart: unless-stopped
    profiles: ["messaging"]
    mem_limit: 128m
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 100mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - parceltrack-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # Mailpit — Local SMTP + catch-all inbox UI
  # Free dev mail server. Workers send real email here; inspect at :8025.
  # ──────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: parceltrack-mailpit
    restart: unless-stopped
    profiles: ["messaging"]
    mem_limit: 256m
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - parceltrack-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8025/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # Kafka — Event streaming (KRaft mode)
  # No Zookeeper — self-managed metadata via Raft.
  #
  # JVM heap capped at 256MB (default is 1GB)
  #
  # Listeners:
  #   INTERNAL   (kafka:29092)    — container-to-container
  #   EXTERNAL   (localhost:9092) — your .NET services on host
  #   CONTROLLER (kafka:9093)     — KRaft internal only
  # ──────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: parceltrack-kafka
    restart: unless-stopped
    profiles: ["messaging"]
    mem_limit: 512m
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}

      KAFKA_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24

      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
    networks:
      - parceltrack-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ──────────────────────────────────────────
  # Kafka topic initialiser — one-shot, then exits.
  # Waits for Kafka to be healthy, creates 4 topics.
  # ──────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: parceltrack-kafka-init
    profiles: ["messaging"]
    mem_limit: 256m
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - parceltrack-net
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Creating Kafka topics...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic shipment.created         --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic shipment.status.changed --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic notification.failed     --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic webhook.failed          --partitions 1 --replication-factor 1
      echo 'Done. Topics:'
      kafka-topics --bootstrap-server kafka:29092 --list
      "
    restart: on-failure

  # ──────────────────────────────────────────
  # Keycloak — Identity & Auth
  # JVM heap capped at 512MB via JAVA_OPTS_APPEND.
  # start-dev skips TLS + clustering — correct for local dev.
  # Connects to the containerised PostgreSQL above (host=postgres).
  #
  # Admin console + realm issuer: http://localhost:8080
  # Realm auto-imported from JSON on first start only.
  # ──────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: parceltrack-keycloak
    restart: unless-stopped
    profiles: ["auth"]
    mem_limit: 768m
    command: start-dev --import-realm
    environment:
      # postgres is the in-compose service name (container DNS)
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/parceltrack_keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8080
      JAVA_OPTS_APPEND: "-Xmx512m -Xms256m"
    ports:
      - "8080:8080"
    volumes:
      - ./Keycloak/parceltrack-realm.json:/opt/keycloak/data/import/parceltrack-realm.json:ro
    networks:
      - parceltrack-net
    # No hard `depends_on`: postgres lives in a different profile (db), and
    # Compose would reject `--profile auth` on its own. `restart: unless-stopped`
    # + the start_period below let Keycloak retry until Postgres is reachable.
    # Always run auth together with db: --profile db --profile auth up -d
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
